<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Downloading Genuine Reach... · Mindful Earth</title>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--forest:#4d554c;--bark:#5d4133;--sand:#d9b382;--parchment:#f5f0e8;--sage:#bfc0ab;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Lora',Georgia,serif;background:var(--parchment);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 6vw;}
.wrap{max-width:480px;}
.ginkgo{margin-bottom:24px;opacity:0.4;}
h1{font-family:'Gloock',serif;font-size:28px;color:var(--bark);margin-bottom:12px;line-height:1.2;}
p{font-size:15px;line-height:1.8;color:var(--forest);margin-bottom:24px;}
.status{font-family:'Jost',sans-serif;font-size:11px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:var(--sage);margin-bottom:32px;display:block;}
.btn{font-family:'Jost',sans-serif;font-size:11px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;text-decoration:none;background:var(--bark);color:#f8f6f1;padding:14px 28px;display:inline-block;cursor:pointer;border:none;}
.note{font-family:'Jost',sans-serif;font-size:11px;color:var(--sage);line-height:1.7;margin-top:20px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="ginkgo">
    <svg viewBox="0 0 80 100" xmlns="http://www.w3.org/2000/svg" width="48" height="60">
      <path d="M40 88 Q20 70 16 50 Q12 30 22 16 Q30 6 40 8 Q28 22 26 42 Q24 62 40 88Z" fill="none" stroke="#5d4133" stroke-width="1.5"/>
      <path d="M40 88 Q60 70 64 50 Q68 30 58 16 Q50 6 40 8 Q52 22 54 42 Q56 62 40 88Z" fill="none" stroke="#5d4133" stroke-width="1.5"/>
      <line x1="40" y1="88" x2="40" y2="98" stroke="#d9b382" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </div>
  <span class="status" id="status">Preparing your download...</span>
  <h1>Your guide is ready.</h1>
  <p>If your download doesn't start automatically, click the button below.</p>
  <button class="btn" id="dlBtn" onclick="startDownload()">Download Genuine Reach</button>
  <p class="note">Open the downloaded file in Chrome or Firefox.<br>Your answers save automatically in that browser.</p>
</div>

<script>
function startDownload() {
  var link = document.createElement('a');
  link.href = '/assets/downloads/genuine-reach.html';
  link.download = 'genuine-reach.html';
  link.style.display = 'none';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  document.getElementById('status').textContent = 'Download started ✓';
}

// Also try fetch + blob approach which bypasses GitHub Pages routing
async function autoDownload() {
  try {
    var response = await fetch('/assets/downloads/genuine-reach.html');
    var text = await response.text();
    var blob = new Blob([text], {type: 'text/html'});
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url;
    link.download = 'genuine-reach.html';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
    document.getElementById('status').textContent = 'Download started ✓';
  } catch(e) {
    // Fallback to direct link
    document.getElementById('status').textContent = 'Click the button to download';
  }
}

// Auto-trigger on page load
window.addEventListener('load', autoDownload);
</script>
</body>
</html>
